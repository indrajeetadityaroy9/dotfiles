# Repo tasks. Tools come from .config/mise/config.toml, which chezmoi symlinks
# into ~/.config/mise, so it is both this repo's toolset and the global one.

[tasks.lint]
description = "shellcheck scripts; syntax-check zsh and ssh configs"
run = """
shellcheck bootstrap.sh dot_config/private_git/template/hooks/executable_pre-commit
for f in dot_zshenv dot_config/zsh/dot_zprofile dot_config/zsh/dot_zshrc; do zsh -n "$f"; done
ssh -T -G -F private_dot_ssh/private_config github.com >/dev/null
"""

[tasks.render]
description = "render every template; syntax-check rendered scripts and git config"
run = """
out=$(mktemp)
trap 'rm -f "$out"' EXIT
for t in $(git ls-files '*.tmpl'); do
    chezmoi --source . --override-data '{"git_name":"ci","git_email":"ci@example.com"}' \
        execute-template --init --promptString git_name=ci --promptString git_email=ci@example.com \
        <"$t" >"$out" || { echo "FAILED: $t"; exit 1; }
    case "$t" in
        *.sh.tmpl) sh -n "$out" && shellcheck "$out" ;;
        */private_git/config.tmpl) git config --file "$out" --list >/dev/null ;;
    esac
    echo "ok: $t"
done
"""

[tasks.secrets]
description = "scan full git history for secrets"
run = "gitleaks git --redact --no-banner ."

[tasks.check]
description = "run every check (CI)"
depends = ["lint", "render", "secrets"]

[tasks.pre-commit]
description = "git pre-commit hook: static checks + secrets in staged changes"
depends = ["lint", "render"]
run = "gitleaks git --staged --redact --no-banner -v ."

[tasks.lock]
description = "sync .config/mise/mise.lock and locks/ with config.toml"
env = { MISE_GLOBAL_CONFIG_FILE = "{{config_root}}/.config/mise/config.toml" }
run = "mise lock --global"

[tasks.update]
description = "advance the python/node/rust/java channels in mise.lock"
env = { MISE_GLOBAL_CONFIG_FILE = "{{config_root}}/.config/mise/config.toml" }
run = "mise lock --global --bump python node rust java"
