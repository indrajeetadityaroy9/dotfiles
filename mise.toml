[tools]
chezmoi    = "2.72.2"
gitleaks   = "8.30.1"
prek       = "0.5.3"
shellcheck = "0.11.0"

[settings]
lockfile = true
lockfile_mode = "generate"
lockfile_platforms = ["macos-arm64"]

[tasks.lint]
description = "shellcheck all shell sources"
run = "shellcheck bootstrap.sh .chezmoiscripts/*.sh dot_config/private_git/template/hooks/executable_pre-commit"

[tasks.secrets]
description = "scan full history for secrets"
run = "gitleaks git --config .gitleaks.toml --redact --no-banner -v ."

[tasks.render]
description = "render every template and syntax-check the result"
run = """
set -eu
for t in $(find . -name '*.tmpl' -not -path './.git/*'); do
    chezmoi --override-data '{"git_name":"ci","git_email":"ci@example.com"}' \
        execute-template --init \
        --promptString git_name=ci --promptString git_email=ci@example.com \
        <"$t" >"$MISE_PROJECT_ROOT/.rendered.tmp" || { echo "FAILED: $t"; exit 1; }
    case "$t" in
        *zsh*) zsh -n "$MISE_PROJECT_ROOT/.rendered.tmp" ;;
        *.sh.tmpl) sh -n "$MISE_PROJECT_ROOT/.rendered.tmp" && shellcheck "$MISE_PROJECT_ROOT/.rendered.tmp" ;;
    esac
    echo "template ok: $t"
done
rm -f "$MISE_PROJECT_ROOT/.rendered.tmp"
"""

[tasks.check-static]
description = "syntax-check the non-templated zsh and ssh configs"
run = """
set -eu
zsh -n dot_config/zsh/dot_zprofile
ssh -G -F private_dot_ssh/private_config github.com >/dev/null
echo "static configs ok"
"""

[tasks.check]
description = "run every check"
depends = ["lint", "secrets", "render", "check-static"]

[tasks.diff]
description = "preview what chezmoi would change"
run = "chezmoi --source . diff"

[tasks.apply]
description = "apply dotfiles from this working tree"
run = "chezmoi --source . apply"

[tasks.update]
description = "bump locked tool versions without editing configs"
run = ["mise lock --bump", "mise lock --global --bump"]
