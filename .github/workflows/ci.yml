name: ci
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    env:
      MISE_AUTO_INSTALL: "false" # only the tools installed below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          minimum_release_age: 3d

      # Before any `mise install` (with lockfile = true it rewrites mise.lock). Fail only
      # on version drift, not on metadata a newer mise rewrites.
      - name: check mise.lock
        run: |
          drift=$(mise run lock --dry-run --json)
          [ "$drift" = "[]" ] && exit 0
          echo "$drift"
          echo "::error::mise.lock is stale; run 'mise run lock' and commit"
          exit 1

      - run: mise install --locked chezmoi gitleaks shellcheck
      - run: mise run check
