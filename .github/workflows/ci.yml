name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        with:
          install: false

      - run: mise trust && mise install
        env:
          MISE_LOCKED: "1"

      - run: mise run check
