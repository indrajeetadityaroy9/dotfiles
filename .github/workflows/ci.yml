name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        with:
          install: false

      - name: install locked tools
        run: |
          mise trust
          mise install
        env:
          MISE_LOCKED: "1"

      - name: secrets (full history, repo rules)
        run: mise run secrets

      - name: shellcheck
        run: mise run lint

      - name: render templates + zsh -n
        run: |
          sudo apt-get install -y -qq zsh
          mise run render
