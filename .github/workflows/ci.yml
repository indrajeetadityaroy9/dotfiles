name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks git needs real history. The old `gitleaks dir` on a
          # depth-1 checkout only ever saw the working tree.
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        with:
          install: false

      - name: secrets (full history, repo rules)
        run: mise exec gitleaks@8.30.1 -- gitleaks git --config .gitleaks.toml --redact --no-banner -v .

      - name: shellcheck
        run: mise exec shellcheck@0.11.0 -- shellcheck bootstrap.sh .chezmoiscripts/*.sh

      # Renders the Linux branch of every template and syntax-checks the zsh.
      # The darwin branch is covered by `chezmoi diff` before apply, which is
      # cheaper than keeping a macOS runner on the payroll.
      - name: render templates + zsh -n
        run: |
          sudo apt-get install -y -qq zsh
          mise install chezmoi@2.72.2
          CHEZMOI="$(mise where chezmoi@2.72.2)/chezmoi"
          for t in $(find . -name '*.tmpl' -not -path './.git/*'); do
            "$CHEZMOI" \
              --override-data '{"git_name":"ci","git_email":"ci@example.com"}' \
              execute-template --init \
              --promptString git_name=ci --promptString git_email=ci@example.com \
              < "$t" > rendered || { echo "FAILED: $t"; exit 1; }
            case "$t" in *zsh*) zsh -n rendered && echo "zsh -n ok: $t";; esac
          done
