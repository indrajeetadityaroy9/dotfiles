name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        with:
          install: false

      - name: secrets (full history, repo rules)
        run: mise exec -- gitleaks git --config .gitleaks.toml --redact --no-banner -v .

      - name: shellcheck
        run: mise exec -- shellcheck bootstrap.sh .chezmoiscripts/*.sh

      - name: render templates + zsh -n
        run: |
          sudo apt-get install -y -qq zsh
          for t in $(find . -name '*.tmpl' -not -path './.git/*'); do
            mise exec -- chezmoi \
              --override-data '{"git_name":"ci","git_email":"ci@example.com"}' \
              execute-template --init \
              --promptString git_name=ci --promptString git_email=ci@example.com \
              < "$t" > rendered || { echo "FAILED: $t"; exit 1; }
            case "$t" in
              *zsh*) zsh -n rendered ;;
              *.sh.tmpl) sh -n rendered && mise exec -- shellcheck rendered ;;
            esac
            echo "template ok: $t"
          done
