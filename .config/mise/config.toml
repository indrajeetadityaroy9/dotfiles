# Global toolset (CLIs and runtimes). config.toml states intent ("latest" or a runtime
# channel); mise.lock pins exact versions and checksums. chezmoi symlinks both into
# ~/.config/mise, so `mise use -g tool` edits them here. After editing by hand:
# `mise run lock`. Advance every tool within its request (3-day cooldown): `mise run update`.
# The tasks at the bottom are global: `mise run upgrade|doctor|completions` from any directory.
[settings]
lockfile = true
lockfile_platforms = ["macos-arm64"]
minimum_release_age = "3d"

[settings.python]
uv_venv_auto = "source"

[tools]
uv     = "latest"
python = "3.13"
node   = "lts"
rust   = "stable"
java   = "temurin-21"

atuin      = "latest"
bat        = "latest"
chezmoi    = "latest"
"aqua:Wilfred/difftastic" = "latest"
dua        = "latest"
fastfetch  = "latest"
fd         = "latest"
fzf        = "latest"
gh         = "latest"
git-lfs    = "latest"
gitleaks   = "latest"
helix      = "latest"
jq         = "latest"
"aqua:jesseduffield/lazygit" = "latest"
ripgrep    = "latest"
shellcheck = "latest"
starship   = "latest"
tealdeer   = "latest"
yq         = "latest"
zoxide     = "latest"

"github:PyO3/maturin"    = "latest"
"aqua:astral-sh/ruff"    = "latest"
"github:astral-sh/ty"    = "latest"
"aqua:ducaale/xh"        = "latest"

"pypi:huggingface-hub" = "latest"
"pypi:ipython"         = "latest"
"npm:corepack"         = "latest"

[tasks.upgrade]
description = "pull and apply dotfiles, then upgrade Homebrew packages and mise itself"
run = ["chezmoi update", "brew update", "brew upgrade", "brew autoremove", "mise self-update --yes"]

[tasks.doctor]
description = "report drift between this Mac and the dotfiles repo"
run = '''
brewfile="$(chezmoi source-path)/Brewfile"
rc=0
st=$(chezmoi status)
[ -z "$st" ] || { echo "chezmoi: managed files changed outside the repo (chezmoi diff):"; echo "$st"; rc=1; }
brew bundle check --no-upgrade --file "$brewfile" >/dev/null ||
    { brew bundle check --no-upgrade --verbose --file "$brewfile"; rc=1; }
brew bundle cleanup --formula --cask --file "$brewfile" || rc=1
missing=$(mise ls --global --missing)
[ -z "$missing" ] || { echo "mise: not installed:"; echo "$missing"; rc=1; }
exit $rc
'''

[tasks.completions]
description = "regenerate zsh completions for the tools above (chezmoi runs this when mise.lock changes)"
run = '''
dir="${XDG_DATA_HOME:-$HOME/.local/share}/zsh/completions"
tmp=$(mktemp -d)
gen() {
    f=$1; shift
    "$@" >"$tmp/$f" 2>/dev/null && [ -s "$tmp/$f" ] ||
        { rm -f "$tmp/$f"; echo "completions: skipped $f" >&2; }
}
gen _atuin    atuin gen-completions --shell zsh
gen _bat      bat --completion zsh
gen _cargo    rustup completions zsh cargo
gen _chezmoi  chezmoi completion zsh
gen _dua      dua completions zsh
gen _fd       fd --gen-completions zsh
gen _gh       gh completion -s zsh
gen _git-lfs  git-lfs completion zsh
gen _gitleaks gitleaks completion zsh
gen _hx       sh -c 'cat "$(mise where helix)"/*/contrib/completion/hx.zsh'
gen _maturin  maturin completions zsh
gen _mise     mise completion zsh
gen _rg       rg --generate complete-zsh
gen _ruff     ruff generate-shell-completion zsh
gen _rustup   rustup completions zsh rustup
gen _starship starship completions zsh
gen _ty       ty generate-shell-completion zsh
gen _uv       uv generate-shell-completion zsh
gen _uvx      uvx --generate-shell-completion zsh
gen _xh       xh --generate complete-zsh
gen _yq       yq shell-completion zsh
gen _zoxide   sh -c 'cat "$(mise where zoxide)/completions/_zoxide"'
rm -rf "$dir" && mkdir -p "${dir%/*}" && mv "$tmp" "$dir"
rm -f "${XDG_CACHE_HOME:-$HOME/.cache}"/zsh/zcompdump-*
'''
