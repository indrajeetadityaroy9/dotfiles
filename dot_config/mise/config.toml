[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-arm64", "linux-x64"]
idiomatic_version_file_enable_tools = []

[tools]
node   = "lts"
rust   = "stable"
python = "3.13"
java   = "temurin-21"

atuin      = "18.22.0"
bat        = "0.26.1"
btop       = { version = "1.4.7", os = ["linux"] }
direnv     = "2.37.1"
dua        = "2.45.0"
eza        = "0.23.5"
fastfetch  = "2.68.1"
fd         = "10.5.0"
fzf        = "0.74.4"
gh         = "2.100.0"
git-lfs    = "3.8.0"
gitleaks   = "8.30.1"
helix      = "25.07.1"
jq         = "1.8.2"
prek       = "0.5.3"
ripgrep    = "15.2.0"
shellcheck = "0.11.0"
starship   = "1.26.0"
uv         = "0.12.14"
zoxide     = "0.10.0"

"pipx:httpie" = { version = "3.2.4", depends = ["python", "uv"] }
"pipx:huggingface-hub" = { version = "1.14.0", extras = "cli", depends = ["python", "uv"] }
"pipx:ipython" = { version = "9.13.0", depends = ["python", "uv"] }
"pipx:maturin" = { version = "1.13.3", depends = ["python", "uv"] }
"pipx:mypy" = { version = "2.0.0", depends = ["python", "uv"] }
"pipx:pytest" = { version = "9.0.3", depends = ["python", "uv"] }
"pipx:python-dotenv" = { version = "1.2.2", depends = ["python", "uv"] }
"pipx:ruff" = { version = "0.15.12", depends = ["python", "uv"] }
"npm:corepack" = { version = "0.34.6", depends = "node" }
"npm:pyright" = { version = "1.1.410", depends = "node" }
