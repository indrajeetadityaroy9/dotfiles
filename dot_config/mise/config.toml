[settings]
lockfile = true
lockfile_mode = "generate"
lockfile_platforms = ["macos-arm64", "linux-arm64", "linux-x64"]
minimum_release_age = "3d"
idiomatic_version_file_enable_tools = []

[settings.python]
uv_venv_auto = "source"

[tools]
uv     = "0.12.15"
python = "3.13"
node   = "lts"
rust   = "stable"
java   = "temurin-21"

atuin      = "18.22.0"
bat        = "0.26.1"
btop       = { version = "1.4.7", os = ["linux"] }
direnv     = "2.37.1"
dua        = "2.45.0"
"github:eza-community/eza" = { version = "0.23.5", exe = "eza", os = ["linux"] }
fastfetch  = "2.68.1"
fd         = "10.5.0"
fzf        = "0.74.4"
gh         = "2.101.0"
git-lfs    = "3.8.0"
gitleaks   = "8.30.1"
helix      = "25.07.1"
jq         = "1.8.2"
prek       = "0.5.3"
ripgrep    = "15.2.0"
shellcheck = "0.11.0"
starship   = "1.26.0"
yq         = "4.53.6"
zoxide     = "0.10.0"

"pypi:httpie"           = "3.2.4"
"pypi:huggingface-hub"  = "1.31.0"
"pypi:ipython"          = "9.17.1"
"pypi:maturin"          = "1.15.0"
"pypi:mypy"             = "2.3.1"
"pypi:pytest"           = "9.1.1"
"pypi:python-dotenv"    = { version = "1.2.3", extras = "cli" }
"pypi:ruff"             = "0.16.8"
"npm:corepack"          = "0.34.6"
"npm:pyright"           = "1.1.410"
