repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: mise exec -- gitleaks git --staged --config .gitleaks.toml --redact --no-banner -v
        language: system
        pass_filenames: false

      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck
        language: system
        files: '^(bootstrap\.sh|\.chezmoiscripts/.*\.sh)$'
