[".local/share/zsh/plugins/zsh-autosuggestions/zsh-autosuggestions.zsh"]
type = "file"
url = "https://raw.githubusercontent.com/zsh-users/zsh-autosuggestions/master/zsh-autosuggestions.zsh"
refreshPeriod = "168h"

[".local/share/zsh/plugins/zsh-completions"]
type = "archive"
url = "https://github.com/zsh-users/zsh-completions/archive/refs/heads/master.tar.gz"
exact = true
stripComponents = 1
refreshPeriod = "168h"
include = ["*/src/**"]

[".local/share/zsh/plugins/zsh-syntax-highlighting"]
type = "archive"
url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/heads/master.tar.gz"
exact = true
stripComponents = 1
refreshPeriod = "168h"
include = ["*/.revision-hash", "*/.version", "*/highlighters/**", "*/zsh-syntax-highlighting.zsh"]
exclude = ["*/highlighters/*/test-data", "*/highlighters/*/*.zunit"]
